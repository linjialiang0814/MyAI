name: Feature request
description: Propose a focused improvement to the local personal agent.
title: "[Feature]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request does not contain secrets or personal data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need and why the current behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior rather than only an implementation choice.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives and trade-offs
      description: Note effects on privacy, offline use, compatibility, latency, or resource usage.
