spring.application.name=login

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
python.service.base-url=${PYTHON_SERVICE_BASE_URL:http://127.0.0.1:8000}
python.service.connect-timeout-millis=${PYTHON_SERVICE_CONNECT_TIMEOUT_MILLIS:5000}
python.service.request-timeout-seconds=${PYTHON_SERVICE_REQUEST_TIMEOUT_SECONDS:160}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/login_demo?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
