spring.datasource.url=${DB_URL:jdbc:sqlite:myai-local.db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

myai.auth.mode=${MYAI_AUTH_MODE:local}
myai.local-user.username=${MYAI_LOCAL_USERNAME:local-user}
myai.local-user.email=${MYAI_LOCAL_EMAIL:local-user@myai.local}
myai.local-user.password=${MYAI_LOCAL_PASSWORD:local-password}
